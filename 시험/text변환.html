<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 스마트폰 화면 크기에 맞추는 모바일 필수 태그 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EPUB / TXT 변환기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    /* 기본 여백 초기화 및 박스 사이즈 기준 변경 */
    * { box-sizing: border-box; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif; 
      max-width: 600px; /* PC에서는 최대 폭 제한 */
      margin: 0 auto; 
      padding: 20px; 
      line-height: 1.6; 
      background-color: #f4f6f8; /* 눈이 편안한 배경색 */
      color: #333;
    }
    
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 24px; color: #1a202c; }
    h2 { margin-top: 0; font-size: 1.1rem; color: #2d3748; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; margin-bottom: 15px; }
    
    /* 모바일에서 깔끔하게 보이는 카드 UI */
    .card { 
      background: #ffffff; 
      border: 1px solid #e2e8f0; 
      padding: 20px; 
      border-radius: 12px; 
      margin-bottom: 20px; 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); 
    }
    
    label { display: block; font-weight: 600; margin-top: 12px; font-size: 0.95rem; color: #4a5568; }
    
    /* 파일 선택 버튼 디자인 */
    input[type="file"] { 
      margin-top: 8px; 
      display: block; 
      width: 100%; 
      padding: 10px; 
      border: 1.5px dashed #cbd5e0; 
      border-radius: 8px; 
      background-color: #f7fafc;
      font-size: 0.9rem;
    }
    
    /* 모바일에서 누르기 편한 크고 둥근 버튼 */
    button { 
      margin-top: 20px; 
      width: 100%; 
      padding: 14px; 
      background-color: #3182ce; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 1rem; 
      font-weight: bold; 
      cursor: pointer; 
      transition: background-color 0.2s ease;
    }
    button:hover, button:active { background-color: #2b6cb0; }

    /* 화면이 아주 작은 스마트폰(아이폰 SE 등)을 위한 미세 조정 */
    @media (max-width: 480px) {
      body { padding: 15px; }
      .card { padding: 16px; }
      h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <h1>📚 EPUB / TXT 올인원 툴</h1>

  <!-- 1. TXT -> EPUB 변환 -->
  <div class="card">
    <h2>1. TXT ➔ EPUB 변환</h2>
    <label>TXT 파일 선택: <input type="file" id="txtInput" accept=".txt"></label>
    <label>표지 이미지 (선택): <input type="file" id="txtCoverInput" accept="image/*"></label>
    <button onclick="convertTxtToEpub()">EPUB 변환 및 다운로드</button>
  </div>

  <!-- 2. EPUB -> TXT 변환 -->
  <div class="card">
    <h2>2. EPUB ➔ TXT 추출</h2>
    <label>EPUB 파일 선택: <input type="file" id="epubInput" accept=".epub"></label>
    <button onclick="convertEpubToTxt()">TXT 추출 및 다운로드</button>
  </div>

  <!-- 3. EPUB 표지 교체 -->
  <div class="card">
    <h2>3. 기존 EPUB 표지 교체</h2>
    <label>EPUB 파일 선택: <input type="file" id="targetEpubInput" accept=".epub"></label>
    <label>새 표지 이미지 선택: <input type="file" id="targetCoverInput" accept="image/*"></label>
    <button onclick="replaceEpubCover()">표지 변경 후 다운로드</button>
  </div>

  <!-- 4. EPUB 내 Base64 삭제 -->
  <div class="card">
    <h2>4. EPUB 내 Base64(난수열) 정제</h2>
    <label>EPUB 파일 선택: <input type="file" id="cleanEpubInput" accept=".epub"></label>
    <button onclick="cleanBase64FromEpub()">Base64 삭제 후 다운로드</button>
  </div>

  <script>
    // helper: 파일 다운로드 트리거
    function saveBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 1. TXT -> EPUB
    async function convertTxtToEpub() {
      const txtFile = document.getElementById('txtInput').files[0];
      const coverFile = document.getElementById('txtCoverInput').files[0];
      if (!txtFile) return alert('TXT 파일을 선택해주세요.');

      const text = await txtFile.text();
      const lines = text.split(/\r?\n/);
      const title = txtFile.name.replace(/\.[^/.]+$/, "");
      const zip = new JSZip();

      // mimetype
      zip.file("mimetype", "application/epub+zip", { compression: "STORE" });

      // container.xml
      zip.folder("META-INF").file("container.xml", 
        `\x3C?xml version="1.0"?\x3E\n\x3Ccontainer version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"\x3E\n  \x3Crootfiles\x3E\n    \x3Crootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/\x3E\n  \x3C/rootfiles\x3E\n\x3C/container\x3E`);

      const oebps = zip.folder("OEBPS");
      const LINES_PER_PAGE = 1000;
      let manifestItems = [];
      let spineItems = [];
      let navPoints = [];
      let chapterIdx = 1;

      for (let i = 0; i < lines.length; i += LINES_PER_PAGE) {
        const chunk = lines.slice(i, i + LINES_PER_PAGE);
        const pTags = chunk.filter(l => l.trim().length > 0).map(l => `\x3Cp\x3E${l.trim()}\x3C/p\x3E`).join("\n");
        const docContent = `\x3C?xml version="1.0" encoding="utf-8"?\x3E\n\x3C!DOCTYPE html\x3E\n\x3Chtml xmlns="http://www.w3.org/1999/xhtml"\x3E\n\x3Chead\x3E\x3Ctitle\x3E${title} - Part ${chapterIdx}\x3C/title\x3E\x3C/head\x3E\n\x3Cbody\x3E${chapterIdx === 1 ? `\x3Ch2\x3E${title}\x3C/h2\x3E` : ''}${pTags}\x3C/body\x3E\n\x3C/html\x3E`;
        
        const fileName = `chapter_${chapterIdx}.xhtml`;
        oebps.file(fileName, docContent);
        
        manifestItems.push(`\x3Citem id="chap_${chapterIdx}" href="${fileName}" media-type="application/xhtml+xml"/\x3E`);
        spineItems.push(`\x3Citemref idref="chap_${chapterIdx}"/\x3E`);
        navPoints.push(`\x3CnavPoint id="np_${chapterIdx}" playOrder="${chapterIdx}"\x3E\x3CnavLabel\x3E\x3Ctext\x3E파트 ${chapterIdx}\x3C/text\x3E\x3C/navLabel\x3E\x3Ccontent src="${fileName}"/\x3E\x3C/navPoint\x3E`);
        chapterIdx++;
      }

      // 표지 이미지 처리
      let coverManifest = "";
      let coverMeta = "";
      if (coverFile) {
        const coverBuffer = await coverFile.arrayBuffer();
        const ext = coverFile.name.split('.').pop().toLowerCase();
        const coverFileName = `cover.${ext}`;
        const mimeType = coverFile.type || "image/jpeg";
        oebps.file(coverFileName, coverBuffer);
        coverManifest = `\x3Citem id="cover-img" href="${coverFileName}" media-type="${mimeType}" properties="cover-image"/\x3E`;
        coverMeta = `\x3Cmeta name="cover" content="cover-img"/\x3E`;
      }

      // content.opf
      const opf = `\x3C?xml version="1.0" encoding="utf-8"?\x3E\n\x3Cpackage xmlns="http://www.idpf.org/2007/opf" unique-identifier="BookID" version="3.0"\x3E\n  \x3Cmetadata xmlns:dc="http://purl.org/dc/elements/1.1/"\x3E\n    \x3Cdc:title\x3E${title}\x3C/dc:title\x3E\n    \x3Cdc:language\x3Eko\x3C/dc:language\x3E\n    \x3Cdc:identifier id="BookID"\x3Eurn:uuid:${crypto.randomUUID()}\x3C/dc:identifier\x3E\n    ${coverMeta}\n  \x3C/metadata\x3E\n  \x3Cmanifest\x3E\n    \x3Citem id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/\x3E\n    ${coverManifest}\n    ${manifestItems.join("\n    ")}\n  \x3C/manifest\x3E\n  \x3Cspine toc="ncx"\x3E\n    ${spineItems.join("\n    ")}\n  \x3C/spine\x3E\n\x3C/package\x3E`;
      oebps.file("content.opf", opf);

      // toc.ncx
      const ncx = `\x3C?xml version="1.0" encoding="utf-8"?\x3E\n\x3Cncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1"\x3E\n  \x3Chead\x3E\x3Cmeta name="dtb:uid" content="urn:uuid:12345"/\x3E\x3C/head\x3E\n  \x3CdocTitle\x3E\x3Ctext\x3E${title}\x3C/text\x3E\x3C/docTitle\x3E\n  \x3CnavMap\x3E\n${navPoints.join("\n")}\n  \x3C/navMap\x3E\n\x3C/ncx\x3E`;
      oebps.file("toc.ncx", ncx);

      const resultBlob = await zip.generateAsync({ type: "blob", mimeType: "application/epub+zip" });
      saveBlob(resultBlob, `${title}.epub`);
    }

    // 2. EPUB -> TXT
    async function convertEpubToTxt() {
      const epubFile = document.getElementById('epubInput').files[0];
      if (!epubFile) return alert('EPUB 파일을 선택해주세요.');

      const zip = await JSZip.loadAsync(epubFile);
      let textResults = [];

      for (const [relativePath, file] of Object.entries(zip.files)) {
        if (/\.(xhtml|html|htm)$/i.test(relativePath)) {
          const content = await file.async("text");
          const parser = new DOMParser();
          const doc = parser.parseFromString(content, "text/html");
          textResults.push(doc.body.innerText.trim());
        }
      }

      const fullText = textResults.join("\n\n");
      const blob = new Blob([fullText], { type: "text/plain;charset=utf-8" });
      saveBlob(blob, `${epubFile.name.replace(/\.[^/.]+$/, "")}.txt`);
    }

    // 3. EPUB 표지 교체
    async function replaceEpubCover() {
      const epubFile = document.getElementById('targetEpubInput').files[0];
      const coverFile = document.getElementById('targetCoverInput').files[0];
      if (!epubFile || !coverFile) return alert('EPUB 파일과 표지 이미지를 모두 선택해주세요.');

      const zip = await JSZip.loadAsync(epubFile);
      const containerXml = await zip.file("META-INF/container.xml").async("text");
      const parser = new DOMParser();
      const containerDoc = parser.parseFromString(containerXml, "application/xml");
      const rootfile = containerDoc.querySelector("rootfile");
      const opfPath = rootfile.getAttribute("full-path");

      const opfDir = opfPath.includes("/") ? opfPath.substring(0, opfPath.lastIndexOf("/") + 1) : "";
      const opfXml = await zip.file(opfPath).async("text");
      const opfDoc = parser.parseFromString(opfXml, "application/xml");

      const ext = coverFile.name.split('.').pop().toLowerCase();
      const coverImgName = `new_cover.${ext}`;
      const fullCoverPath = opfDir + coverImgName;

      const coverBuffer = await coverFile.arrayBuffer();
      zip.file(fullCoverPath, coverBuffer);

      const manifest = opfDoc.querySelector("manifest");
      const metadata = opfDoc.querySelector("metadata");
      const coverId = "custom-cover-id";

      let item = opfDoc.querySelector(`item#${coverId}`);
      if (!item) {
        item = opfDoc.createElement("item");
        item.setAttribute("id", coverId);
        manifest.appendChild(item);
      }
      item.setAttribute("href", coverImgName);
      item.setAttribute("media-type", coverFile.type || "image/jpeg");
      item.setAttribute("properties", "cover-image");

      let meta = opfDoc.querySelector('meta[name="cover"]');
      if (!meta) {
        meta = opfDoc.createElement("meta");
        meta.setAttribute("name", "cover");
        metadata.appendChild(meta);
      }
      meta.setAttribute("content", coverId);

      const serializer = new XMLSerializer();
      zip.file(opfPath, serializer.serializeToString(opfDoc));

      const resultBlob = await zip.generateAsync({ type: "blob", mimeType: "application/epub+zip" });
      saveBlob(resultBlob, `${epubFile.name.replace(/\.[^/.]+$/, "")}_표지추가.epub`);
    }

    // 4. EPUB 내 Base64 난수열 삭제 기능 추가
    async function cleanBase64FromEpub() {
      const epubFile = document.getElementById('cleanEpubInput').files[0];
      if (!epubFile) return alert('EPUB 파일을 선택해주세요.');

      const zip = await JSZip.loadAsync(epubFile);
      let totalRemoved = 0;
      
      const regex = new RegExp("\\x3E\\s*[A-Za-z0-9+/=]{30,}\\s*\\x3C", "g");

      for (const [relativePath, file] of Object.entries(zip.files)) {
        if (!file.dir && /\.(xhtml|html|htm|xml|opf)$/i.test(relativePath)) {
          let content = await file.async("text");
          
          const matches = content.match(regex);
          if (matches) {
            totalRemoved += matches.length;
            content = content.replace(regex, '\x3E\x3C');
            zip.file(relativePath, content);
          }
        }
      }

      if (totalRemoved === 0) {
        alert("제거할 대상(Base64 난수열)이 없습니다. 정상적인 파일입니다.");
        return;
      }

      const resultBlob = await zip.generateAsync({ type: "blob", mimeType: "application/epub+zip" });
      saveBlob(resultBlob, `${epubFile.name.replace(/\.[^/.]+$/, "")}_cleaned.epub`);
      
      alert(`완료! 총 ${totalRemoved}건의 난수열이 제거되었습니다.`);
    }
  </script>
</body>
</html>
